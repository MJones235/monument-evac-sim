[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monument-evacuation"
version = "0.1.0"
description = "Monument Station evacuation study: Proulx (1991) drills, LLM vs rule-based agents"
requires-python = ">=3.12"  # matches evacusim
dependencies = [
    "evacusim @ git+https://github.com/MJones235/llm-evacuation-sim.git",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "optuna>=4.0",  # monument fit
]

[project.scripts]
monument = "monument_evacuation.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify.
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line length is the formatter's job; long strings/comments are tolerated
    "E402",  # scripts load .env / patch sys.path before imports (removed in the src/ restructure)
    "SIM102",  # nested ifs are kept where each condition carries its own comment
    "SIM108",  # ternaries are not always clearer than if/else
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: full-geometry regression runs against committed snapshots (slow, ~1 min)",
    "integration: short full-geometry runs checking end-to-end behaviour (a few seconds each)",
]

[tool.setuptools.packages.find]
where = ["src"]
