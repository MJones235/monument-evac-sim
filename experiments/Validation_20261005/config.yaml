extends: ../Calibration/config.yaml

# Replay of a real, observed hour at Monument for comparison against hand
# counts: Monday 5 Oct 2026, Blackett Street exit counted 09:03:44–10:03:16
# (354 people; data/calibration/collected/blackett-st-2026-05-10_10-03-31.csv).
#
# Inputs generated by data/calibration/build_window_timetable.py:
#   * timetable.csv — the real train arrivals logged that morning
#     (monument_arrivals_20261005_071548.csv), 08:51–10:02. Alighting is sized
#     so 602 passengers leave during the counting window: Blackett's 354 plus
#     Grey Street and Eldon Square at 35% of Blackett each (354 x 1.70). Only
#     the total is fixed — which exit each passenger takes is the model's
#     choice, so the simulated Blackett count is the thing to validate.
#   * entrance_usage.csv — street arrivals (boarders) mirror the exits: in the
#     counting window, 354 enter via Blackett Street and 124 each via Grey
#     Street and Eldon Square (602 total), as Poisson arrivals at that rate.
#     The warm-up from 08:51 runs at the same rate.
#
# Window: start 08:51 (10 min of trains before the ~09:01 arrivals whose
# passengers reach the street at the start of counting) and run to 10:09
# (~5 min after counting stops, so the last trains clear).
# 10:09 - 08:51 = 4680 s = 46800 steps at the inherited dt of 0.10 s.
simulation:
  start_time_s: 31860       # 08:51:00
  max_iterations: 46800     # to 10:09:00

calibration:
  entrance_usage_csv: data/calibration/blackett_20261005/entrance_usage.csv
  timetable_csv: data/calibration/blackett_20261005/timetable.csv
