extends: ../base.yaml

# Feature A — calibration under non-evacuation conditions.
# Passengers arrive at runtime as a stochastic Poisson process driven by
# station usage data (street entrances) + a train timetable (alighting bursts).
# Runs fully LLM-free on the rule-based decision engine (Feature B): no language
# model or embedder is built and zero LLM calls are made. The initial population
# is empty (count: 0, snapshot cleared); agents are spawned by the
# RuntimeSpawnController as the schedule becomes due.
decision:
  engine: rule_based
  rule_weights:
    proximity: 0.5
    busyness: 0.3
    familiarity: 0.2

agents:
  count: 0                  # population arrives at runtime
  snapshot_load_path: null  # base.yaml sets monument_80.json — must clear it

simulation:
  # --- Performance tuning for the 24 h calibration run (no LLM, low density) ---
  # Physics timestep: 0.10 s (base is 0.05). Halves the step backbone and all
  # per-step overhead; JuPedSim's speed model is stable at this dt for the low
  # agent density here (peak ~350 concurrent).
  dt: 0.10
  # Re-plan routes every 20 s (base 30, Calibration was 5). Boarders/alighters
  # walk to a fixed goal, so 5 s re-planning was needless work.
  decision_interval: 20.0
  # A full day: start at midnight (t=0) and run 24 h.  At dt=0.10 s,
  # 24 h = 86400 s / 0.10 = 864,000 steps.  Lower for a quick smoke test
  # (e.g. 36000 = 1 h).
  max_iterations: 864000

# No fire alarm / exit-blocking events during a normal-operations calibration run.
events: []

performance:
  # One decision group (base default is 3). With staggered groups, runtime-spawned
  # agents are never placed in the rotation, so a boarder waiting on the platform
  # would never be re-evaluated when its train arrives. A single group means every
  # active agent is reconsidered each decision cycle, so a waiting boarder boards
  # the next train (30 s dwell > 20 s cycle).
  decision_groups: 1
  # Re-evaluate the moment an agent changes level, so a boarder starts looking for
  # a train as soon as it reaches the platform (and an alighter heads out on arrival).
  immediate_redecision_on_transfer: true

calibration:
  enabled: true
  seed: 7
  # Passengers here are regular commuters who know the station: they know the
  # concourse down-escalators to the platforms (novices would only ever see the
  # street exits and never descend to board). Drives knowledge_profile for every
  # runtime-spawned agent.
  knowledge_profile: commuter
  spawn_jitter_m: 1.0        # base jitter disc; retries grow it for arrival bursts
  entrance_usage_csv: data/calibration/entrance_usage.csv
  timetable_csv: data/calibration/timetable.csv
  # Spawn points are walkable-area interior points (entrance polys sit at the
  # street mouth, outside the walkable floor), resolved from the Monument geometry.
  spawn_points:
    blackett_street: { level: "0",  xy: [65.0, 44.0] }  # concourse floor, inside the Blackett exit threshold (x<78)
    grey_street:     { level: "0",  xy: [90.8, -9.4] }
    eldon_square:    { level: "0",  xy: [34.5, 17.5] }  # eldon corridor mouth on concourse floor
    "1": { level: "-1", xy: [-2.8, -9.5] }    # platform_1 interior (through, Lower)
    "2": { level: "-1", xy: [-20.7, -1.2] }   # platform_2 interior (through, Lower)
    "3": { level: "-1", xy: [-49.9, 46.4] }   # platform_3 interior (loop, Upper)
    "4": { level: "-1", xy: [-48.7, 35.7] }   # platform_4 interior (loop, Upper)
  # Boarders' journey destinations — any of the four platforms.
  entrance_dest_exits: [train_platform_1, train_platform_2, train_platform_3, train_platform_4]
  platform_exit: grey_street                                 # alighters' logical destination
