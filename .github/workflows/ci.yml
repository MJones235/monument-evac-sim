name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.10
      - run: ruff check
      - run: ruff format --check
  # The golden-run regression tests (pytest -m golden) need the evacusim engine
  # and full geometry; run them locally before merging a refactor.
